<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Football • Game Hub</title><style>
:root{--red:#ef443b;--ink:#111626;--panel:#1b253b;--line:#3a4963;--gold:#ffce64;--muted:#9cabc4}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#f4f1e8;font:16px 'Courier New',monospace}button,input,select{font:inherit}button{cursor:pointer;background:#26354e;border:2px solid #61718d;box-shadow:0 4px #080d17;color:inherit;padding:12px 18px;font-weight:bold;text-transform:uppercase}button:hover{background:#374a68}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--red);border-color:#ff8d7e}button.gold{background:#735522;border-color:var(--gold)}button.small{padding:8px 12px;font-size:13px}input,select{background:#0c1424;color:white;border:2px solid var(--line);padding:11px;max-width:100%}header{padding:18px 5%;display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--red);background:#0c111e}header b{letter-spacing:2px}header span{font-size:12px;color:var(--muted)}main{max-width:1140px;margin:auto;padding:36px 24px 60px}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:12px}h1{font-size:clamp(32px,6vw,66px);line-height:1.02;letter-spacing:-3px;margin:14px 0}h2{margin:0 0 16px;font-size:25px}h3{margin:8px 0}p{line-height:1.6;color:var(--muted)}.hero{position:relative;overflow:hidden;padding:24px 0 32px}.hero:after{content:'';position:absolute;right:0;top:12px;width:38%;height:85%;opacity:.18;background:repeating-linear-gradient(90deg,transparent 0 48px,#d0e6c9 49px 51px),repeating-linear-gradient(0deg,#285441 0 29px,#337153 30px 59px);transform:skewY(-8deg);z-index:-1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,.panel{border:2px solid var(--line);background:var(--panel);padding:24px;box-shadow:5px 5px #070c16}.mode{text-align:left;min-height:170px;position:relative;display:block;width:100%;text-transform:none}.mode strong{display:block;font-size:25px;margin:14px 0 8px}.mode em{font-size:12px;color:var(--gold);font-style:normal;letter-spacing:2px}.mode span{display:block;color:var(--muted);font-size:14px;line-height:1.5;max-width:90%}.mode:hover{border-color:var(--red)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0}.stat{border-left:3px solid var(--red);padding-left:14px}.stat b{font-size:28px;display:block}.stat span{color:var(--muted);font-size:12px}nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.badge{padding:6px 9px;border:1px solid var(--line);font-size:12px;color:var(--gold)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f3e3bb;color:#192034;border:3px solid #ad8b4b;padding:14px 20px;z-index:20;max-width:90vw;display:none}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}.scroll{overflow:auto}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-top:20px}.player{border:2px solid var(--line);padding:16px;background:#111c30}.player b{display:block;margin:12px 0;font-size:18px}.player.selected{border-color:var(--gold)}#game{display:none;position:fixed;inset:0;background:black;z-index:10}#gamebar{height:56px;background:#121d30;padding:8px;display:flex;align-items:center;gap:8px}#gamebar span{font-size:12px;color:var(--muted);margin-left:auto}iframe{border:0;width:100%;height:calc(100% - 56px)}.field{width:100%;height:auto;background:#285d44;border:3px solid #b7cbaa;image-rendering:pixelated}details{margin:20px 0}summary{cursor:pointer;color:var(--gold)}.notice{border-left:3px solid var(--gold);padding:10px 16px;background:#242734;font-size:13px;line-height:1.6;color:#cad2df}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted)}.danger{color:#ff9e95}@media(max-width:680px){.grid{grid-template-columns:1fr}main{padding:24px 16px}.panel,.card{padding:18px}header span{display:none}#gamebar span{display:none}.mode{min-height:150px}h1{letter-spacing:-1px}}
</style></head><body><header><b>RETRO<span style="color:var(--red)"> FOOTBALL</span></b><span>32 TEAMS • REAL PLAYERS • YOUR LEGACY</span><button class="small" id="account">ACCOUNT</button></header><main id="app"><p>Connecting to your locker room…</p></main><div id="toast" role="status"></div><section id="game"><div id="gamebar"><button class="small" id="exitgame">← HUB</button><button class="small" id="cloudsave">SAVE CLOUD</button><span id="bridgeStatus">Engine starting…</span></div><iframe title="Retro Bowl game engine" id="engine" allow="autoplay;fullscreen"></iframe></section><script src="config.js"></script><script>
'use strict';let P,R,KEY,SAVES={},view='home',selectedMode='career',roomCode='',room=null,poll=null,busy=false,saveRevision=0;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getTeam=id=>R.find(t=>t.id===String(id));const getPlayer=id=>{for(const t of R){const p=t.players.find(p=>p.id===id);if(p)return {...p,team:t}}};
function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',6000)}
async function api(path,data){
 if(path==='rosters'){const r=await fetch('rosters.json');if(!r.ok)throw Error('Roster file unavailable');return r.json()}
 const base=String(window.RETRO_CONFIG?.apiBase||'').replace(/\/$/,'');
 if(!/^https?:\/\//.test(base)||base.includes('YOUR-'))throw Error('Set apiBase in config.js to your deployed backend Worker URL.');
 const key=localStorage.getItem('rb27:backend-key'),headers={'Content-Type':'application/json'};if(key)headers.Authorization='Bearer '+key;
 const r=await fetch(base+'/api/'+path,{method:data===undefined?'GET':'POST',headers,...(data===undefined?{}:{body:JSON.stringify(data)})});
 const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');if(path==='session'&&d.key)localStorage.setItem('rb27:backend-key',d.key);return d;
}
async function action(name,data={}){if(busy)return;busy=true;try{const d=await api('profile',{action:name,...data});P=d.profile;SAVES=d.saves;render()}catch(e){toast(e.message)}finally{busy=false}}
const btn=(label,act,cls='')=>'<button class="'+cls+'" data-action="'+act+'">'+label+'</button>';
function teamSelect(){return '<label class="muted">FRANCHISE <select id="team">'+R.map(t=>'<option value="'+t.id+'" '+(t.id===P.team?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label>'}
function pageTop(title,kicker){return '<div class="row spread"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1></div>'+btn('← MAIN MENU','home','small')+'</div>'}
function render(){
 const t=getTeam(P.team);let h='';
 if(view==='home')h='<div class="hero"><div class="eyebrow">THE NEXT CHAPTER STARTS HERE</div><h1>BUILD A TEAM.<br>LEAVE A LEGACY.</h1><p>Choose your path to the Retro Bowl.</p><div class="row">'+teamSelect()+'<span class="badge">'+R.reduce((n,t)=>n+t.players.length,0)+' REAL PLAYER RECORDS</span></div></div><div class="grid">'+[['ultimate','01 / COLLECT & BUILD','ULTIMATE TEAM','Open packs with earned coins. Collect real players and select your 12-player lineup.'],['online','02 / COACH VS COACH','ONLINE','Invite a friend. Lock in your plays and compete in a live, turn-based football match.'],['dynasty','03 / BUILD YOUR FRANCHISE','DYNASTY','Manage seasons, earn rewards and build your franchise legacy.'],['road','04 / BECOME THE STORY','ROAD TO THE RETRO BOWL','Create your athlete, train and build a career from rookie to star.']].map(([m,n,title,desc])=>'<button class="card mode" data-action="'+m+'"><em>'+n+'</em><strong>'+title+'</strong><span>'+desc+'</span></button>').join('')+'</div><nav>'+btn('CAREER MODE','career','primary')+btn('NFL ROSTERS','rosters')+'</nav><p class="muted">Original on-field engine included. New modes use separate saves.</p>';
 if(view==='career')h=pageTop('CAREER MODE','YOUR TEAM. YOUR CALL.')+'<div class="panel"><h2>Head coach career</h2><p>Play the supplied Retro Bowl engine: manage your roster, hire staff, draft players and compete on the field. The roster bridge imports real names into existing star-player slots for your in-engine franchise.</p><div class="row">'+btn('PLAY CAREER','play','primary')+btn('RESTORE CLOUD SAVE','restore')+'</div><p class="muted">Start or continue a save inside the engine. Its chosen franchise determines your imported roster. New draft prospects are generated by the engine.</p></div>'+saveNote('career');
 if(view==='dynasty'){const d=P.dynasty;h=pageTop('DYNASTY','THE FRANCHISE DESK')+'<div class="panel"><div class="row spread"><h2>'+esc(t.name)+'</h2><span class="badge">SEASON '+d.season+'</span></div><div class="stats">'+stat(d.wins+'–'+d.losses,'RECORD')+stat(Math.min(17,d.week),'WEEK')+stat(d.rings,'LEGACY TITLES')+stat(P.coins,'COINS')+'</div><div class="row">'+(d.week<=17?btn('SIMULATE WEEK '+d.week,'simulate','primary'):btn('NEXT SEASON','season','gold'))+btn('ON-FIELD DYNASTY SAVE','play')+btn('RESTORE ENGINE SAVE','restore')+'</div><p class="muted">Management simulation uses equal team strength. A 12-win season earns a legacy title. The engine campaign progresses independently.</p></div><div class="panel" style="margin-top:18px"><h2>Season results</h2>'+(d.history.length?'<table><tr><th>WK</th><th>OPPONENT</th><th>FINAL</th></tr>'+d.history.slice().reverse().map(g=>'<tr><td>'+g.week+'</td><td>'+esc(g.opponent)+'</td><td>'+(g.won?'W ':'L ')+g.home+'–'+g.away+'</td></tr>').join('')+'</table>':'<p>Your season starts now.</p>')+'</div>'+saveNote('dynasty');}
 if(view==='road'){const r=P.road;h=pageTop('ROAD TO THE<br>RETRO BOWL','FROM ROOKIE TO LEGEND')+'<div class="panel"><div class="row"><input id="athletename" aria-label="Athlete name" maxlength="24" value="'+esc(r.name)+'"><select id="position" aria-label="Position">'+['QB','RB','WR'].map(p=>'<option '+(p===r.position?'selected':'')+'>'+p+'</option>').join('')+'</select>'+btn('SAVE ATHLETE','athlete','small')+'</div><div class="stats">'+stat(r.level,'LEVEL')+stat(r.xp,'XP')+stat(r.yards,'CAREER YARDS')+stat(r.touchdowns,'TOUCHDOWNS')+'</div><div class="row">'+btn('DAILY TRAINING','train','gold')+btn('SIMULATE CAREER GAME','roadgame','primary')+btn('ON-FIELD CAREER SAVE','play')+btn('RESTORE ENGINE SAVE','restore')+'</div><p class="muted">Daily training: +100 XP / +250 coins. Career games: +100 coins and performance XP. Athlete statistics belong to this management mode and are separate from engine statistics.</p>'+(P.lastRoad?'<p>Latest performance: '+P.lastRoad.yards+' yards • '+P.lastRoad.touchdowns+' TD</p>':'')+'</div>'+saveNote('road');}
 if(view==='ultimate'){h=pageTop('ULTIMATE TEAM','COLLECT. SELECT. COMPETE.')+'<div class="panel"><div class="row spread"><h2>Your locker</h2><span class="badge">'+P.coins+' COINS</span></div><p>Three real-player cards per pack. Duplicate cards return 50 coins each. All players have equal baseline strength; no official ratings are claimed.</p><div class="row">'+btn('OPEN PACK • 250','pack','gold')+btn('DAILY TRAINING','train')+btn('ON-FIELD SAVE','play')+'</div><p class="muted">'+P.cards.length+' collected • '+P.lineup.length+'/12 selected. The collection lineup does not replace the engine roster.</p>'+(P.lastPack?.length?'<p>Last pack: '+P.lastPack.map(id=>esc(getPlayer(id)?.name)).join(' / ')+'</p>':'')+'</div><div class="collection">'+P.cards.map(id=>{let p=getPlayer(id);return '<div class="player '+(P.lineup.includes(id)?'selected':'')+'"><span class="badge">'+esc(p.position)+' • '+esc(p.team.abbr)+'</span><b>'+esc(p.name)+'</b><p class="muted">#'+esc(p.number||'—')+'</p><button class="small" data-card="'+id+'">'+(P.lineup.includes(id)?'REMOVE':'SELECT')+'</button></div>'}).join('')+'</div>';}
 if(view==='rosters')h=pageTop('NFL ROSTERS','REAL IDENTITIES • TEAM COLORS')+'<div class="panel">'+teamSelect()+'<p class="muted">ESPN snapshot • '+esc(t.season?.displayName||'')+' • '+t.players.length+' player records including reserves and practice squads. Fetched '+esc(t.fetchedAt.slice(0,10))+'.</p><input id="search" placeholder="Search player or position" aria-label="Search roster"><div class="scroll"><table id="rostertable"><thead><tr><th>#</th><th>PLAYER</th><th>POS</th><th>AGE</th><th>STATUS</th></tr></thead><tbody>'+t.players.map(p=>'<tr><td>'+esc(p.number||'—')+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.position)+'</td><td>'+esc(p.age||'—')+'</td><td>'+esc(p.status)+'</td></tr>').join('')+'</tbody></table></div></div>';
 if(view==='online')h=pageTop('ONLINE H2H','A FRIEND. A RIVAL. ONE WINNER.')+'<div class="panel"><h2>Play-call head to head</h2><p>Two coaches choose offense and defense simultaneously. Match your rival’s play to reduce the gain and increase turnover chances. Twelve possessions; high score wins.</p><div class="row"><input id="roomcode" aria-label="Room code" maxlength="12" placeholder="ROOM CODE" value="'+esc(roomCode)+'">'+btn('CREATE ROOM','create','primary')+btn('JOIN ROOM','join')+'</div><p class="muted">This is a separate online football game. The original canvas engine is single-player.</p></div><div id="match"></div>';
 if(view==='account')h=pageTop('YOUR ACCOUNT','CLOUD SAVE & RECOVERY')+'<div class="panel"><h2>Keep your recovery key private</h2><p>This key restores this account on another device. Anyone with it can access your saves and collection.</p>'+btn('SHOW / HIDE KEY','showkey')+'<pre id="key" style="display:none;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(KEY)+'</pre><hr><p>Restore an existing account:</p><div class="row"><input id="recovery" type="password" placeholder="Paste recovery key" aria-label="Recovery key" size="38">'+btn('RESTORE ACCOUNT','recover')+'</div></div>';
 $('app').innerHTML=h+'<footer>COMMUNITY ENGINE MOD • Not an official NFL or New Star Games release.<details><summary>Features & limitations</summary><p>Includes the uploaded browser engine and all its assets. Real roster identities are imported into existing star slots; original attributes, roster limits and generated future drafts remain. New management modes and online H2H are separate from the original engine campaign. Cloud saves are manual. Keep your account recovery key to move between devices.</p><p>Roster data: ESPN public NFL feeds, fetched November 10, 2026. Original engine: your supplied archive. Research: <a href="https://apps.apple.com/us/app/nfl-retro-bowl-27/id6476767864" style="color:var(--gold)">NFL Retro Bowl ’27 feature listing</a>.</p></details></footer>';
 if(view==='online'&&room)drawMatch();
}
const stat=(n,l)=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>';
function saveNote(m){return '<p class="muted">Cloud engine save: '+(SAVES[m]?new Date(SAVES[m].updatedAt).toLocaleString():'none yet')+'. Use SAVE CLOUD while playing to upload your current engine save.</p>'}
async function launch(){selectedMode=view;const cloud=await api('save',{action:'load',mode:selectedMode});saveRevision=cloud.save?.revision||0;$('game').style.display='block';$('engine').src='engine.html?mode='+selectedMode;}
async function restore(){const d=await api('save',{action:'load',mode:view});if(!d.save){toast('No cloud engine save for this mode yet.');return}const prefix='rb27:'+view+':';Object.keys(localStorage).filter(k=>k.startsWith(prefix)).forEach(k=>localStorage.removeItem(k));for(const [k,v]of Object.entries(d.save.snapshot))localStorage.setItem(prefix+k,v);toast('Cloud save restored. You can open the engine now.');}
async function saveCloud(){const prefix='rb27:'+selectedMode+':',snapshot={};for(const k of Object.keys(localStorage))if(k.startsWith(prefix))snapshot[k.slice(prefix.length)]=localStorage.getItem(k);if(!Object.keys(snapshot).length){toast('Start a save in the engine before uploading it.');return}const d=await api('save',{mode:selectedMode,revision:saveRevision,snapshot});saveRevision=d.revision;SAVES[selectedMode]={revision:d.revision,updatedAt:d.updatedAt};toast('Engine save uploaded to cloud.');}
async function join(create){const code=create?Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join(''):$('roomcode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6,12}$/.test(code))throw Error('Enter a 6–12 character room code');const data=await api('room/'+code,{action:'join',team:P.team});roomCode=code;room=data;render();clearInterval(poll);poll=setInterval(async()=>{if(view!=='online')return;try{room=await api('room/'+roomCode);drawMatch()}catch(e){clearInterval(poll);toast(e.message)}},1500);}
function drawMatch(){if(!$('match')||!room)return;const r=room,me=r.seat,onOffense=r.offense===me,waiting=r.players.length<2;let html='<div class="panel" style="margin-top:20px"><div class="row spread"><h2>ROOM '+esc(roomCode)+'</h2><span class="badge">'+(r.finished?'FINAL':waiting?'WAITING FOR FRIEND':'LIVE')+'</span></div><div class="stats">'+r.players.map((p,i)=>stat(r.score[i],esc(getTeam(p.team)?.abbr)+' / COACH '+(i+1)+(i===me?' (YOU)':''))).join('')+'</div><canvas id="field" class="field" width="960" height="260"></canvas><p>'+(waiting?'Send your friend the room code and this site address.':r.finished?esc(r.log[r.log.length-1]):'You are on '+(onOffense?'OFFENSE':'DEFENSE')+' • '+r.down+' down • '+Math.max(0,r.target-r.yard)+' to go • Possession '+(r.possessions+1)+'/12')+'</p>';
 if(!r.finished&&!waiting)html+='<div class="row">'+['run','short','deep','kick'].map(p=>'<button data-play="'+p+'" '+(r.locked?'disabled':'')+'>'+(!onOffense?'DEFEND ':'')+p.toUpperCase()+'</button>').join('')+'</div><p class="muted">'+(r.locked?'Play locked. Waiting for opponent.':'Choose your play.')+(r.opponentLocked?' Opponent locked in.':'')+'</p>';
 html+='<p class="muted">'+r.log.slice(-5).map(esc).join('<br>')+'</p>'+(!r.finished?btn('FORFEIT','forfeit','small'):'')+'</div>';$('match').innerHTML=html;
 const c=$('field'),x=c.getContext('2d');x.fillStyle='#286047';x.fillRect(0,0,960,260);for(let i=0;i<=10;i++){const px=50+i*86;x.strokeStyle='#a5bda5';x.beginPath();x.moveTo(px,20);x.lineTo(px,240);x.stroke();x.fillStyle='#c9dcc7';x.font='16px monospace';x.fillText(i===0||i===10?'END':String(i<=5?i*10:100-i*10),px-12,40)}x.fillStyle='#ffce64';x.fillRect(50+r.yard*8.6,60,4,170);x.fillStyle='#ef443b';x.fillRect(50+r.yard*8.6-10,120,22,22);x.fillStyle='#fff';x.fillRect(50+r.yard*8.6+6,126,8,6);
}
document.addEventListener('change',e=>{if(e.target.id==='team')action('team',{team:e.target.value})});
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();document.querySelectorAll('#rostertable tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q))}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.card){const id=b.dataset.card,ids=P.lineup.includes(id)?P.lineup.filter(x=>x!==id):[...P.lineup,id];return await action('lineup',{ids})}
 if(b.dataset.play){if(!room)return;room=await api('room/'+roomCode,{action:'play',play:b.dataset.play,turn:room.turn});drawMatch();return}
 const a=b.dataset.action;if(!a)return;
 if(['home','career','ultimate','dynasty','road','rosters','online'].includes(a)){view=a;if(view!=='online'){clearInterval(poll);poll=null;room=null}render();return}
 if(['pack','train','simulate','season','roadgame'].includes(a))return await action(a);
 if(a==='athlete')return await action(a,{name:$('athletename').value,position:$('position').value});
 if(a==='play')return await launch();if(a==='restore')return await restore();
 if(a==='create'||a==='join')return await join(a==='create');
 if(a==='forfeit'){room=await api('room/'+roomCode,{action:'forfeit'});drawMatch();return}
 if(a==='showkey'){$('key').style.display=$('key').style.display==='none'?'block':'none';return}
 if(a==='recover'){const d=await api('session',{recovery:$('recovery').value.trim()});P=d.profile;KEY=d.key;SAVES=d.saves;room=null;roomCode='';view='home';render();toast('Account restored. Restore cloud engine saves per mode before playing.');}
 }catch(e){toast(e.message)}});
$('account').onclick=()=>{view='account';clearInterval(poll);room=null;render()};$('exitgame').onclick=()=>{$('engine').src='about:blank';$('game').style.display='none';render()};$('cloudsave').onclick=()=>saveCloud().catch(e=>toast(e.message));
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('engine').contentWindow)return;if(e.data?.type==='bridge')$('bridgeStatus').textContent=e.data.message;});
(async()=>{try{R=await api('rosters');const d=await api('session',{});P=d.profile;KEY=d.key;SAVES=d.saves;render()}catch(e){$('app').innerHTML='<div class="panel"><h2>Setup needed</h2><p>'+esc(e.message)+'</p><p>Set the backend URL in config.js and set FRONTEND_ORIGIN on the Worker. See README.txt.</p></div>'}})();
</script></body></html>
